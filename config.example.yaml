# media-ripper configuration. Copy to /etc/media-ripper/config.yaml (or
# ./config.yaml) and edit. Everything is decided here; nothing prompts.
#
# Secrets can also come from the environment:
#   MR_TMDB_API_KEY, MR_MAKEMKV_KEY, MR_OUTPUT_PATH, MR_WORKSPACE, MR_DRIVES,
#   MR_WEB_LISTEN, MR_LOG_LEVEL, MR_NTFY_URL, MR_NTFY_TOKEN, MR_WEBHOOK_URL

# Drives to watch. Empty = every /dev/sr* found (and hot-plugged later).
drives: []
#  - /dev/sr0

# How often each drive is checked for a disc.
poll_interval: 3s

# Local scratch space for rips in progress and state. Needs room for one
# full disc per drive (up to ~100 GB for UHD). Put it on local disk, not the
# network share.
workspace: /var/lib/media-ripper

output:
  # Final library location. A network mount is fine; files are copied there
  # only after the rip is complete.
  path: /mnt/media
  movies_subdir: Movies
  tv_subdir: TV Shows
  unidentified_subdir: _unidentified
  # Naming templates (Plex / Jellyfin conventions by default).
  # Tokens: {title} {year} {series} {season} {episode} {episode_title}
  #         {label} {title_id} {resolution} {source} {date} {datetime}
  # A :02 suffix zero-pads numbers. Double episodes render as E03-E04.
  movie_template: "{title} ({year})/{title} ({year}).mkv"
  tv_template: "{series} ({year})/Season {season:02}/{series} - S{season:02}E{episode:02} - {episode_title}.mkv"
  unidentified_template: "{label} {date}/{label} - t{title_id:02}.mkv"
  # false = never clobber; a " (2)" suffix is added instead.
  overwrite: false
  dir_mode: 0775
  file_mode: 0664
  # Keep the partial rip folder when a job fails (for debugging).
  keep_workspace_on_error: false
  # When a rip fails or is cancelled, keep the titles already ripped. The
  # next attempt on the same disc (reinsert or Rescan) skips titles that
  # are ripped or delivered and continues from the first missing one.
  # Kept workspaces older than resume_max_age are removed at startup.
  resume: true
  resume_max_age: 72h
  # Keep a full decrypted copy of each disc (a BDMV/VIDEO_TS folder that
  # plays like the disc), made while it is still in the drive, after the
  # titles are ripped. 30-90 GB per Blu-ray.
  #   off:  no copy   also: titles and the copy   only: just the copy
  backup: "off"
  backup_path: ""           # default: <output.path>/_backups

makemkv:
  binary: makemkvcon
  # License or beta key. Written to ~/.MakeMKV/settings.conf at startup.
  key: ""
  # Titles shorter than this many seconds are not even listed by MakeMKV.
  min_length: 120
  timeout: 6h          # per title rip
  scan_timeout: 20m
  retries: 1
  extra_args: []
  # Where settings.conf lives (default ~/.MakeMKV). Set write_settings: false
  # to manage that file yourself.
  settings_dir: ""
  write_settings: true

metadata:
  # auto = TMDB when a key is set, then Radarr/Sonarr lookups when they are
  # configured. tmdb | arr | none force one source.
  provider: auto
  tmdb_api_key: ""
  language: en-US
  timeout: 20s
  # Fix discs whose label is useless or misleading. Key = volume label as
  # printed by `media-ripper label`; value = what to search for. Season and
  # disc hints are understood ("Friends S3 D2", "The Matrix 1999").
  label_overrides: {}
  #  "BD_ROM_2": "Blade Runner 2049"
  #  "LOGICAL_VOLUME_ID": "Friends S1 D2"
  # Second chance for discs with a useless label: after the rip, OCR the
  # title card and credits of the longest file (tesseract) and search for
  # the text. A match is accepted only when the runtime agrees. Needs
  # tesseract-ocr and the language packs listed below.
  ocr:
    enabled: false
    tesseract: tesseract
    languages: eng          # tesseract codes, "eng+deu" for several
    head_minutes: 8
    tail_minutes: 4
    frames_per_minute: 20
    max_candidates: 8
    timeout: 20m
  # TheDiscDB (thediscdb.com) catalogues what each title of a published disc
  # is: the main movie, episode S01E03, a named extra. When an identified
  # disc is in it, its titles, episode numbers and names are used instead of
  # guessing from lengths, so TV discs can be ripped in any order. Read from
  # the catalogue's GitHub repository and cached under the workspace.
  thediscdb:
    enabled: true
    repo: TheDiscDb/data
    # Identifies discs with useless labels ("BD_ROM") by a hash of their
    # file sizes. Needs thediscdb.com reachable (some DNS filters block it).
    api: https://thediscdb.com/graphql

selection:
  # Audio/subtitle languages to keep (ISO 639-2 codes). Empty = keep every
  # track. Untagged tracks are always kept.
  languages: []
  #  - eng
  #  - jpn
  # A movie title must be within this much of the TMDB runtime.
  movie_runtime_tolerance: 8m
  # Episode titles must be within ±35% of the episode runtime.
  tv_episode_tolerance: 0.35
  min_movie_duration: 40m
  min_episode_duration: 8m
  # What to do when the disc cannot be identified: longest | all | skip
  unidentified_strategy: longest
  # Treat a title about twice the episode length as a two-part episode.
  allow_double_episodes: true

postprocess:
  # none   = deliver exactly what MakeMKV wrote
  # remux  = stream copy (no re-encode): set the file title, apply the
  #          language filter above. Uses mkvmerge, else ffmpeg.
  # custom = run custom_command with {input} {output} {title} placeholders;
  #          this is where a transcode would go.
  mode: remux
  tool: auto           # auto | mkvmerge | ffmpeg
  set_title: true
  custom_command: []
  #  - ffmpeg
  #  - -i
  #  - "{input}"
  #  - -map
  #  - "0"
  #  - -c:v
  #  - libx265
  #  - -crf
  #  - "18"
  #  - -c:a
  #  - copy
  #  - -c:s
  #  - copy
  #  - "{output}"
  custom_extension: mkv
  timeout: 6h

# Radarr / Sonarr handoff. When enabled for a kind, rips are delivered into
# output.path/<staging_subdir> and the app is asked to import them; it then
# renames and moves them into its own root folder and updates Plex/Jellyfin.
# Titles not yet in the library are added first when add_missing is on.
arr:
  radarr:
    enabled: false
    url: http://radarr:7878
    api_key: ""             # or MR_RADARR_API_KEY
    root_folder: /movies    # Radarr's root folder (as Radarr sees it)
    quality_profile: ""     # name or id; empty = first profile
    add_missing: true
    monitored: false
    import_mode: move       # move | copy
    # When Radarr runs elsewhere, map the staging path to its view of it.
    path_map: {}
    #  "/mnt/media/_incoming": "/data/incoming"
  sonarr:
    enabled: false
    url: http://sonarr:8989
    api_key: ""             # or MR_SONARR_API_KEY
    root_folder: /tv
    quality_profile: ""
    add_missing: true
    monitored: false
    import_mode: move
    path_map: {}
  staging_subdir: _incoming
  # Which discs are imported without you confirming the titles first.
  #   always:    everything (titles chosen by length are imported as they are)
  #   confident: discs TheDiscDB verified title by title, and movies whose
  #              runtime matched; everything else waits in the web UI's
  #              Review section (files stay in staging until you approve)
  #   verified:  only discs TheDiscDB verified
  import_policy: confident
  import_timeout: 10m

eject:
  on_success: true
  # Open the tray as soon as the last title is ripped, before remuxing,
  # delivery and the Radarr/Sonarr import. The drive is free sooner.
  after_rip: true
  # Open the tray when a rip fails. A cancel from the web UI leaves the disc
  # in so you can change settings and press Rescan.
  on_failure: true
  close_tray_on_start: false
  # A disc that was ripped before is ejected without ripping. Set true to rip
  # it again, or press Rip in the web UI for a one-off.
  rerip_same_disc: false

web:
  enabled: true
  listen: ":8080"
  # HTTPS. auto: a certificate made on this machine for its host name, every
  # address and tls_hosts, renewed before it expires (browsers ask once to
  # trust it; compare the fingerprint shown in Settings → Web). files: your
  # own certificate (e.g. from Let's Encrypt). off: plain HTTP. Plain
  # http:// on the same port is redirected to https://.
  tls: auto
  tls_cert: ""
  tls_key: ""
  tls_hosts: []             # e.g. [ripper.example.com, ripper.tailnet.ts.net]

notify:
  # Optional. ntfy topic URL, e.g. https://ntfy.sh/my-ripper
  ntfy_url: ""
  ntfy_token: ""
  # Optional. Receives a JSON POST per event.
  webhook_url: ""
  # Optional. Discord: post as a bot or through a channel webhook.
  # Bot: open Settings → Discord → "Add to Discord" to invite it to a
  # server, then set its token and the channel id (Discord developer mode:
  # right-click the channel → Copy Channel ID). Use your own application id
  # to post as your own bot. Webhook: Channel settings → Integrations →
  # Webhooks → Copy Webhook URL; no bot needed.
  discord:
    application_id: "1556123331047202997"
    bot_token: ""           # or MR_DISCORD_BOT_TOKEN
    channel_id: ""          # or MR_DISCORD_CHANNEL_ID
    webhook_url: ""         # or MR_DISCORD_WEBHOOK_URL
    # Bot messages get buttons: Approve / Discard a disc waiting for review,
    # Cancel a rip, Eject after a failure. They arrive over the bot's own
    # connection to Discord; nothing needs to be reachable from outside.
    # allowed_users limits who may press them (Discord user ids; developer
    # mode → right-click a user → Copy User ID). Empty: anyone who can see
    # the channel.
    buttons: true
    allowed_users: []

updates:
  # Show a notice in the web UI when a newer release is out (checked twice
  # a day on GitHub). The repository is private for now, so a GitHub token
  # with read access is needed; without one the check stays quiet.
  check: true
  repo: SourceQuality/media-ripper
  token: ""                 # or MR_GITHUB_TOKEN

auth:
  # Sign-in for the web UI and API. On first visit the web UI asks you to
  # create the account; `media-ripper passwd` resets it from the command
  # line. Scripts and Prometheus use an API token (Settings → Sign-in).
  # Only turn this off on a network nobody else can reach.
  enabled: true
  username: ""
  password_hash: ""         # set by the web UI or `media-ripper passwd`
  api_token_hash: ""

log:
  level: info          # debug | info | warn | error
  format: text         # text | json
